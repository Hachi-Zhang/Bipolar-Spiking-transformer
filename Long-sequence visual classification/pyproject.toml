[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ijcv-seq-cifar"
version = "1.0.0"
description = "Standalone PyTorch training for sequential CIFAR-10 spiking transformers"
requires-python = ">=3.9"
dependencies = ["torch>=2.0", "torchvision>=0.15", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
