[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "efsdt-seg"
version = "0.1.0"
description = "EFSDT SSA and ShiftMax semantic-segmentation plugin"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
mmlab = ["mmengine>=0.7,<1.0", "mmcv>=2.0,<2.2", "mmsegmentation>=1.1,<1.3"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["efsdt_seg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
